<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">

  <title>Frontend Mentor | Browser extensions manager UI</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <header class="topbar">
    <div class="logo">
      <img src="./assets/images/logo.svg" alt="Extensions Logo">
    </div>

    <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
      <img src="./assets/images/icon-moon.svg" alt="">
    </button>
  </header>

  <main class="container">
    <section class="extensions-header">
      <h1>Extensions List</h1>
      <div class="filters">
        <button class="filter-btn active">All</button>
        <button class="filter-btn">Active</button>
        <button class="filter-btn">Inactive</button>
      </div>
    </section>


    <div class="search-container">
      <input type="text" id="extension-search" placeholder="Search extensions..." aria-label="Search extensions" />
    </div>


    <section class="extensions-grid" id="extensionsGrid"></section>
  </main>



  <div class="modal-overlay" id="removeModal">
    <div class="confirm-modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">

      <h2 id="modal-title">Remove Extension?</h2>

      <p id="modal-message">
        Are you sure you want to remove this extension?
      </p>

      <div class="modal-actions">
        <button id="cancelRemove" class="cancel-btn">
          Cancel
        </button>

        <button id="confirmRemove" class="confirm-btn">
          Remove
        </button>
      </div>

    </div>
  </div>
  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
    Coded by <a href="#">Abhijit Koley</a>.
  </footer>

  <script src="script.js"></script>
</body>

</html>
